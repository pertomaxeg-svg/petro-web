openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Supabase Auth flows handled by the API; sessions use HTTP-only cookies
  - name: management
    description: Company, branch and staff operations protected by Supabase RLS
  - name: fleet
    description: Central fleet, driver, policy, coverage, credential and maintenance operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /supabase/health:
    get:
      operationId: supabaseHealthCheck
      tags: [health]
      summary: Supabase connection check
      description: Checks public Supabase Auth settings only; it does not inspect database access or return credentials
      responses:
        "200":
          description: Public Supabase Auth settings are reachable; database access remains untested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealthStatus"
  /admin/fleet/catalog:
    get:
      operationId: getAdminFleetCatalog
      tags: [fleet]
      summary: Read a central fleet view
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [overview, vehicles, vehicle, drivers, policies, coverage, credentials, documents, odometer, maintenance, events, imports]
        - name: id
          in: query
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: vehicleId
          in: query
          schema: { type: string, format: uuid }
        - name: driverId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, maxLength: 40 }
        - name: coverage
          in: query
          schema: { type: string, enum: [covered, uncovered] }
        - name: fuelType
          in: query
          schema: { type: string, maxLength: 80 }
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, name, plate, updatedAt] }
      responses:
        "200":
          description: Fleet view data; credential hashes, PINs and storage paths are never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetCatalog" }
        "401": { description: Authentication required }
        "403": { description: Fleet read permission required }
  /admin/fleet/company-summaries:
    get:
      operationId: getAdminFleetCompanySummaries
      tags: [fleet]
      summary: Read paginated company and branch fleet summaries
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated company directory or one company with branch-level fleet counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetCompanySummaries" }
        "401": { description: Authentication required }
        "403": { description: Fleet read permission required }
  /admin/fleet/drivers/{driverId}:
    get:
      operationId: getAdminFleetDriverDetail
      tags: [fleet]
      summary: Read one driver profile and dated vehicle links
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Driver record with dated links; PIN secrets are never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetDriverDetail" }
        "401": { description: Authentication required }
        "403": { description: Fleet read permission required }
        "404": { description: Driver not found }
  /admin/fleet/consumption-rates:
    get:
      operationId: getAdminFleetConsumptionRates
      tags: [fleet]
      summary: Read the effective expected fuel consumption and immutable history
      parameters:
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Effective company or branch rate and version history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetConsumptionRates" }
        "401": { description: Authentication required }
        "403": { description: Fleet read permission required }
    post:
      operationId: setAdminFleetConsumptionRate
      tags: [fleet]
      summary: Append a reasoned company or branch consumption-rate version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FleetConsumptionRateInput" }
      responses:
        "201":
          description: New immutable rate version or original result on idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetCommandResult" }
        "400": { description: Invalid rate or reason }
        "401": { description: Authentication required }
        "403": { description: Fleet management permission required }
        "409": { description: Scope or idempotency conflict }
  /admin/fleet/subscription-options:
    get:
      operationId: getAdminFleetSubscriptionOptions
      tags: [fleet]
      summary: Search company vehicle-subscription options for fleet coverage
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Scoped active or scheduled vehicle subscriptions, paginated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetReferenceOptions" }
        "401": { description: Authentication required }
        "403": { description: Fleet read permission required }
  /admin/fleet/stock-options:
    get:
      operationId: getAdminFleetStockOptions
      tags: [fleet]
      summary: Search available NFC stock units for authorized fleet administrators
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Available stock units, paginated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetReferenceOptions" }
        "401": { description: Authentication required }
        "403": { description: Fleet management permission required }
  /admin/fleet/stock-reservations:
    get:
      operationId: getAdminFleetStockReservations
      tags: [fleet]
      summary: Resume installation from NFC units reserved for a credential request
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Reserved stock and its exact request, vehicle, company, and branch association
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetStockReservations" }
        "401": { description: Authentication required }
        "403": { description: Fleet management permission required }
  /admin/workforce:
    get:
      operationId: listAdminWorkforce
      tags: [workforce]
      summary: Read centrally authorized worker assignments or branch-eligible members
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [assignments, candidates], default: assignments }
        - name: branchId
          in: query
          description: Required for candidates
          schema: { type: string, format: uuid }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Actual paginated assignments or eligible branch members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkforcePage" }
        "400": { description: Invalid filter or missing candidate branch }
        "401": { description: Authentication required }
        "403": { description: "Central owner, operations or auditor required" }
  /admin/workforce/assignments:
    post:
      operationId: setAdminWorkerAssignment
      tags: [workforce]
      summary: Create or version-update an explicit branch service assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerAssignmentInput" }
      responses:
        "200":
          description: Saved assignment or exact idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerAssignmentState" }
        "400": { description: Invalid fields }
        "401": { description: Authentication required }
        "403": { description: Central mutation permission or eligible membership missing }
        "404": { description: Branch or assignment absent }
        "409": { description: "Version, payload or organization-service conflict" }
  /operations/capabilities:
    get:
      operationId: getWorkerCapabilities
      tags: [workforce]
      summary: Read only the authenticated caller's currently executable branch services
      responses:
        "200":
          description: Current capabilities, rechecked against Auth, profile, membership and branch state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerCapabilities" }
        "401": { description: Authentication required }
        "403": { description: "Account inactive, unconfirmed or password update required" }
  /operations/pair-verifications:
    post:
      operationId: verifyWorkerDriverPair
      tags: [workforce]
      summary: Verify a scanned credential and driver PIN within the caller's current branch service assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyWorkerDriverPairBody" }
      responses:
        "200":
          description: Failed attempt, lockout or two-minute actor-bound identity proof; never financial authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPairProof" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Assignment or current membership not executable }
        "409": { description: Idempotency conflict }
        "503": { description: PIN verification runtime unavailable }
  /operations/pair-verifications/{id}:
    get:
      operationId: getWorkerPairProof
      tags: [workforce]
      summary: Recheck the caller's own unexpired proof against current assignment, credential and driver link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current proof; invalid proofs disclose no vehicle or driver details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPairProof" }
        "400": { description: Invalid proof identifier }
        "401": { description: Authentication required }
        "403": { description: Account no longer operational }
  /admin/fleet/cards:
    get:
      operationId: getAdminFleetCards
      tags: [fleet]
      summary: Read paginated central card requests, issued credentials, stock, and history
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [overview, requests, issued, stock, history]
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: vehicleId
          in: query
          schema: { type: string, format: uuid }
        - name: fulfillmentMethod
          in: query
          description: Installation or branch-pickup requests only; valid only with view=requests
          schema: { type: string, enum: [install, pickup] }
        - name: status
          in: query
          schema: { type: string, maxLength: 32 }
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Authorized card data with actual database counts and paginated records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetCards" }
        "401": { description: Authentication required }
        "403": { description: Fleet management permission required }
  /admin/fleet/commands:
    post:
      operationId: executeAdminFleetCommand
      tags: [fleet]
      summary: Run an audited, idempotent central fleet command
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFleetCommandRequest" }
      responses:
        "200":
          description: Command applied or original idempotent result returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetCommandResult" }
        "400": { description: Invalid command or validation conflict }
        "401": { description: Authentication required }
        "403": { description: Fleet mutation permission required }
        "409": { description: Version or idempotency conflict }
  /admin/fleet/driver-pairs/verify:
    post:
      operationId: verifyAdminFleetDriverPair
      tags: [fleet]
      summary: Verify a driver-vehicle pair code without returning or logging the code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFleetVerifyPairRequest" }
      responses:
        "200":
          description: Generic verification result and short-lived verification reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetVerifyPairResult" }
        "401": { description: Authentication required }
        "403": { description: Fleet permission or rate limit denied }
  /admin/fleet/driver-pairs/reveal:
    post:
      operationId: revealAdminFleetDriverPairPin
      tags: [fleet]
      summary: Reveal an active driver-pair code to an authorized fleet administrator with a mandatory audit reason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFleetDriverPairPinRevealInput" }
      responses:
        "200":
          description: Plain code returned once to the authorized session; never stored in logs or audit details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetDriverPairPinRevealResult" }
        "400": { description: Invalid link or missing reason }
        "401": { description: Authentication required }
        "403": { description: Fleet management permission required }
        "404": { description: Active link or encrypted code not available }
  /admin/fleet/documents/upload-intent:
    post:
      operationId: createAdminFleetDocumentUploadIntent
      tags: [fleet]
      summary: Create a private storage upload intent for a vehicle document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFleetDocumentUploadIntentRequest" }
      responses:
        "201":
          description: Private Supabase Storage upload intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetDocumentUploadIntent" }
        "401": { description: Authentication required }
        "403": { description: Fleet mutation permission required }
  /admin/fleet/imports/template:
    get:
      operationId: downloadAdminFleetImportTemplate
      tags: [fleet]
      summary: Download the fleet Excel workbook template
      responses:
        "200":
          description: XLSX workbook template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { description: Authentication required }
        "403": { description: Fleet mutation permission required }
  /admin/fleet/imports/preview:
    post:
      operationId: previewAdminFleetImport
      tags: [fleet]
      summary: Parse and validate a fleet workbook without applying records
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Validated preview with row-level errors and no applied records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetCommandResult" }
        "400": { description: Invalid workbook }
        "401": { description: Authentication required }
        "403": { description: Fleet mutation permission required }
  /admin/fleet/imports/{jobId}/apply:
    post:
      operationId: applyAdminFleetImport
      tags: [fleet]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFleetImportApplyRequest" }
      responses:
        "200":
          description: Entire valid import committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleetCommandResult" }
        "400": { description: Preview has errors or import payload is invalid }
        "401": { description: Authentication required }
        "403": { description: Fleet mutation permission required }
        "409": { description: Import already applied or conflicting request }
        "503":
          description: Supabase credentials are missing or the API is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealthStatus"
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a username account with an email reserved for confirmation and recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "202":
          description: Generic confirmation response that does not disclose account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with username and password only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Authenticated; session is stored in an HTTP-only cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: End the current Supabase Auth session
      responses:
        "204":
          description: Session ended
  /auth/recovery:
    post:
      operationId: requestPasswordRecovery
      tags: [auth]
      summary: Send password recovery instructions to the registered email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "202":
          description: Generic response that does not disclose whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /auth/password:
    post:
      operationId: updatePassword
      tags: [auth]
      summary: Set a new password from a verified recovery session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdateRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Return the current account status and authorized role context
      responses:
        "200":
          description: Current account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /auth/bootstrap-status:
    get:
      operationId: getOwnerBootstrapStatus
      tags: [auth]
      summary: Check whether the signed-in, designated account may perform one-time owner setup
      responses:
        "200":
          description: Bootstrap availability only; no owner identity is disclosed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
  /auth/bootstrap-owner:
    post:
      operationId: bootstrapOwner
      tags: [auth]
      summary: Initialize the designated, confirmed platform owner once with the private bootstrap token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapOwnerRequest"
      responses:
        "200":
          description: Owner initialized for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthActionResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /auth/callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: Exchange an email confirmation or recovery code for a session
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: next
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Redirect to a local application page
        "400":
          description: Invalid or expired confirmation link
  /organizations:
    get:
      operationId: listOrganizations
      tags: [management]
      summary: List organizations visible through the current account's RLS scope
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: kind
          in: query
          schema: { type: string, enum: [company, station, provider] }
        - name: approvalStatus
          in: query
          schema: { type: string, enum: [pending, approved] }
        - name: operationalStatus
          in: query
          schema: { type: string, enum: [inactive, active, suspended] }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, code, kind, approvalStatus, operationalStatus, createdAt], default: createdAt }
        - name: sortDirection
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Filtered and paginated organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "401":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createOrganization
      tags: [management]
      summary: Create an organization request for platform owner approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created in pending status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}:
    get:
      operationId: getOrganization
      tags: [management]
      summary: Get an organization visible through the current account's RLS scope
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          $ref: "#/components/responses/ApiError"
    patch:
      operationId: updateOrganization
      tags: [management]
      summary: Update organization details with optimistic concurrency and audit
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
