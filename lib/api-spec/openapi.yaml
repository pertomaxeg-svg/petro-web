        expectedVersion: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, minLength: 12, maxLength: 160 }
    WorkerAssignmentState:
      type: object
      required: [id, userId, branchId, serviceGroup, active, version]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        serviceGroup: { $ref: "#/components/schemas/WorkerServiceGroup" }
        active: { type: boolean }
        version: { type: integer, minimum: 1 }
    WorkerAssignmentRecord:
      allOf:
        - { $ref: "#/components/schemas/WorkerAssignmentState" }
        - type: object
          required: [displayName, organizationId, organizationName, organizationKind, branchName, updatedAt, canExecute]
          properties:
            displayName: { type: string }
            organizationId: { type: string, format: uuid }
            organizationName: { type: string }
            organizationKind: { type: string, enum: [station, provider, company] }
            branchName: { type: string }
            updatedAt: { type: string, format: date-time }
            canExecute: { type: boolean }
    WorkerCandidate:
      type: object
      required: [userId, displayName, username]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        username: { type: string, nullable: true }
    WorkforcePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            oneOf:
              - { $ref: "#/components/schemas/WorkerAssignmentRecord" }
              - { $ref: "#/components/schemas/WorkerCandidate" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        canManage: { type: boolean }
        organizationKind: { type: string, enum: [station, provider, company] }
    WorkerCapability:
      type: object
      required: [assignmentId, assignmentVersion, branchId, branchName, organizationId, organizationName, organizationKind, serviceGroup]
      properties:
        assignmentId: { type: string, format: uuid }
        assignmentVersion: { type: integer, minimum: 1 }
        branchId: { type: string, format: uuid }
        branchName: { type: string }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationKind: { type: string, enum: [station, provider] }
        serviceGroup: { $ref: "#/components/schemas/WorkerServiceGroup" }
    WorkerCapabilities:
      type: object
      required: [items, pinVerificationReady]
      properties:
        pinVerificationReady: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkerCapability" }
    VerifyWorkerDriverPairBody:
      type: object
      additionalProperties: false
      required: [branchId, serviceGroup, credentialToken, pinCode, idempotencyKey]
      properties:
        branchId: { type: string, format: uuid }
        serviceGroup: { type: string, enum: [fuel, wash, oils, batteries, filters, parts, consumables] }
        credentialToken: { type: string, minLength: 16, maxLength: 512, pattern: "^[A-Za-z0-9_-]{16,512}$", writeOnly: true }
        pinCode: { type: string, minLength: 4, maxLength: 4, pattern: "^[0-9]{4}$", writeOnly: true }
        idempotencyKey: { type: string, minLength: 16, maxLength: 120 }
    WorkerPairProof:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        locked: { type: boolean }
        retryAt: { type: [string, "null"], format: date-time }
        verificationId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        driverName: { type: string }
        vehicle: { $ref: "#/components/schemas/WorkerPairProofVehicle" }
    WorkerPairProofVehicle:
      type: object
      required: [plate, brand, model, fuelType]
      properties:
        plate: { type: string }
        brand: { type: string }
        model: { type: string }
        fuelType: { type: string }
        tankCapacityLiters: { type: [number, "null"] }
