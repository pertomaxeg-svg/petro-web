openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Supabase Auth flows handled by the API; sessions use HTTP-only cookies
  - name: management
    description: Company, branch and staff operations protected by Supabase RLS
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /supabase/health:
    get:
      operationId: supabaseHealthCheck
      tags: [health]
      summary: Supabase connection check
      description: Checks public Supabase Auth settings only; it does not inspect database access or return credentials
      responses:
        "200":
          description: Public Supabase Auth settings are reachable; database access remains untested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealthStatus"
        "503":
          description: Supabase credentials are missing or the API is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealthStatus"
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a username account with an email reserved for confirmation and recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "202":
          description: Generic confirmation response that does not disclose account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with username and password only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Authenticated; session is stored in an HTTP-only cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthActionResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: End the current Supabase Auth session
      responses:
        "204":
          description: Session ended
  /auth/recovery:
    post:
      operationId: requestPasswordRecovery
      tags: [auth]
      summary: Send password recovery instructions to the registered email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "202":
          description: Generic response that does not disclose whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /auth/password:
    post:
      operationId: updatePassword
      tags: [auth]
      summary: Set a new password from a verified recovery session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdateRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Return the current account status and authorized role context
      responses:
        "200":
          description: Current account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /auth/bootstrap-status:
    get:
      operationId: getOwnerBootstrapStatus
      tags: [auth]
      summary: Check whether the signed-in, designated account may perform one-time owner setup
      responses:
        "200":
          description: Bootstrap availability only; no owner identity is disclosed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
  /auth/bootstrap-owner:
    post:
      operationId: bootstrapOwner
      tags: [auth]
      summary: Initialize the designated, confirmed platform owner once with the private bootstrap token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapOwnerRequest"
      responses:
        "200":
          description: Owner initialized for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthActionResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /auth/callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: Exchange an email confirmation or recovery code for a session
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: next
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Redirect to a local application page
        "400":
          description: Invalid or expired confirmation link
  /organizations:
    get:
      operationId: listOrganizations
      tags: [management]
      summary: List organizations visible through the current account's RLS scope
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: kind
          in: query
          schema: { type: string, enum: [company, station, provider] }
        - name: approvalStatus
          in: query
          schema: { type: string, enum: [pending, approved] }
        - name: operationalStatus
          in: query
          schema: { type: string, enum: [inactive, active, suspended] }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, code, kind, approvalStatus, operationalStatus, createdAt], default: createdAt }
        - name: sortDirection
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Filtered and paginated organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "401":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createOrganization
      tags: [management]
      summary: Create an organization request for platform owner approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created in pending status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}:
    get:
      operationId: getOrganization
      tags: [management]
      summary: Get an organization visible through the current account's RLS scope
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          $ref: "#/components/responses/ApiError"
    patch:
      operationId: updateOrganization
      tags: [management]
      summary: Update organization details with optimistic concurrency and audit
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/approval:
    post:
      operationId: approveOrganization
      tags: [management]
      summary: Approve a pending organization with a required reason
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Approval recorded; operation remains inactive until activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/status:
    patch:
      operationId: updateOrganizationStatus
      tags: [management]
      summary: Activate, suspend, or reactivate an approved organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
      responses:
        "200":
          description: Operational status changed and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/branches:
    get:
      operationId: listBranches
      tags: [management]
      summary: List branches visible to the current account in an organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Visible branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createBranch
      tags: [management]
      summary: Create a branch in an organization the account can manage
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResult"
        "403":
          $ref: "#/components/responses/ApiError"
  /branches:
    get:
      operationId: listBranchesPaginated
      tags: [management]
      summary: Search and paginate branches within one RLS-visible organization
      parameters:
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: approvalStatus
          in: query
          schema: { type: string, enum: [pending, approved] }
        - name: operationalStatus
          in: query
          schema: { type: string, enum: [inactive, active, suspended] }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, code, approvalStatus, operationalStatus, createdAt], default: createdAt }
        - name: sortDirection
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Filtered and paginated visible branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchPage"
        "403":
          $ref: "#/components/responses/ApiError"
  /branches/{branchId}:
    patch:
      operationId: updateBranch
      tags: [management]
      summary: Update branch details without changing its parent organization
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchRequest"
      responses:
        "200":
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /branches/{branchId}/approval:
    post:
      operationId: approveBranch
      tags: [management]
      summary: Approve a pending branch with a required reason
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchApprovalRequest"
      responses:
        "200":
          description: Branch approval recorded; operation remains inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /branches/{branchId}/status:
    patch:
      operationId: updateBranchStatus
      tags: [management]
      summary: Change the operational status of an approved branch and write an audit event
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchStatusRequest"
      responses:
        "200":
          description: Branch status changed and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/memberships:
    get:
      operationId: listMemberships
      tags: [management]
      summary: List employees visible within the account's organization or branch scope
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Visible memberships and profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: setMembership
      tags: [management]
      summary: Assign or update a registered user's organization and branch permissions
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMembershipRequest"
      responses:
        "200":
          description: Membership updated and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResult"
        "403":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/invitations:
    get:
      operationId: listInvitations
      tags: [management]
      summary: List pending, accepted, and revoked invitations visible to a manager
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Invitations for the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createInvitation
      tags: [management]
      summary: Create a one-time invitation for a company employee
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created; raw link is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreatedResult"
        "403":
          $ref: "#/components/responses/ApiError"
  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [management]
      summary: Accept a one-time invitation after verifying the registered email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Invitation accepted and membership activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResult"
        "403":
          $ref: "#/components/responses/ApiError"
  /invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [management]
      summary: Revoke an unused invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation revoked
        "403":
          $ref: "#/components/responses/ApiError"
  /users/{userId}/status:
    patch:
      operationId: setUserStatus
      tags: [management]
      summary: Activate or suspend an account; suspended owners cannot retain a stale session
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
      responses:
        "200":
          description: Account state changed and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "403":
          $ref: "#/components/responses/ApiError"
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ApiError:
      description: Request rejected or unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SupabaseHealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            [connected, not_configured, unauthorized, unavailable, project_mismatch]
        authHttpStatus:
          type: integer
          description: Original HTTP status from the Supabase Auth settings endpoint, when a request was made
        authErrorCode:
          type: string
          description: Sanitized upstream error code, when available
        dataAccessStatus:
          type: string
          enum: [not_tested]
        message:
          type: string
      required:
        - status
        - dataAccessStatus
    ApiError:
      type: object
      properties:
        message:
          type: string
      required: [message]
    MessageResult:
      type: object
      properties:
        message:
          type: string
      required: [message]
    SignUpRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        recoveryEmail:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 120
        password:
          type: string
          minLength: 12
          maxLength: 128
        redirectTo:
          type: string
          format: uri
      required: [username, recoveryEmail, displayName, password, redirectTo]
    SignUpResult:
      type: object
      properties:
        status:
          type: string
          enum: [confirmation_required]
        message:
          type: string
      required: [status, message]
    SignInRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [username, password]
    AuthActionResult:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required: [status, message]
    RecoveryRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Username or registered recovery email; never accepted for sign-in
          minLength: 3
          maxLength: 254
        redirectTo:
          type: string
          format: uri
      required: [identifier, redirectTo]
    PasswordUpdateRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
      required: [password]
    AuthMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        username:
          type: [string, "null"]
        loginIdentifierType:
          type: string
          enum: [username]
        state:
          type: string
          enum: [active, pending]
        accessContext: {}
      required: [id, displayName, state, accessContext]
    BootstrapStatus:
      type: object
      properties:
        available:
          type: boolean
      required: [available]
    BootstrapOwnerRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
      required: [token]
    CreateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        kind:
          type: string
          enum: [company, station, provider]
        code:
          type: string
          minLength: 2
          maxLength: 40
          pattern: "^[A-Za-z0-9_-]+$"
        legalName: { type: ["string", "null"], maxLength: 200 }
        contactName: { type: ["string", "null"], maxLength: 160 }
        contactPhone: { type: ["string", "null"], maxLength: 24 }
        contactEmail: { type: ["string", "null"], format: email, maxLength: 320 }
        address: { type: string, maxLength: 500 }
      required: [name, kind, code, address]
    PageInfo:
      type: object
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      required: [page, pageSize, total, totalPages]
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [company, station, provider] }
        code: { type: ["string", "null"] }
        legal_name: { type: ["string", "null"] }
        contact_name: { type: ["string", "null"] }
        contact_phone: { type: ["string", "null"] }
        contact_email: { type: ["string", "null"] }
        address: { type: string }
        country_code: { type: string, enum: [EG] }
        currency: { type: string, enum: [EGP] }
        status: { type: string, enum: [pending, active, suspended] }
        approval_status: { type: string, enum: [pending, approved] }
        operational_status: { type: string, enum: [inactive, active, suspended] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
      required: [id, name, kind, code, legal_name, contact_name, contact_phone, contact_email, address, country_code, currency, status, approval_status, operational_status, created_at, updated_at, version]
    OrganizationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
      required: [items, page, pageSize, total, totalPages]
    UpdateOrganizationRequest:
      type: object
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 160 }
        kind: { type: string, enum: [company, station, provider] }
        code: { type: string, minLength: 2, maxLength: 40, pattern: "^[A-Za-z0-9_-]+$" }
        legalName: { type: ["string", "null"], maxLength: 200 }
        contactName: { type: ["string", "null"], maxLength: 160 }
        contactPhone: { type: ["string", "null"], maxLength: 24 }
        contactEmail: { type: ["string", "null"], format: email, maxLength: 320 }
        address: { type: string, maxLength: 500 }
        reason: { type: ["string", "null"], minLength: 5, maxLength: 500 }
      required: [expectedVersion, name, kind, code, legalName, contactName, contactPhone, contactEmail, address]
    ApprovalRequest:
      type: object
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [expectedVersion, reason]
    StatusRequest:
      type: object
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        operationalStatus: { type: string, enum: [active, suspended] }
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [expectedVersion, operationalStatus, reason]
    BranchStatusRequest:
      type: object
      required: [organizationId, expectedVersion, operationalStatus, reason]
      properties:
        organizationId:
