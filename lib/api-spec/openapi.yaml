openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Supabase Auth flows handled by the API; sessions use HTTP-only cookies
  - name: management
    description: Company, branch and staff operations protected by Supabase RLS
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /supabase/health:
    get:
      operationId: supabaseHealthCheck
      tags: [health]
      summary: Supabase connection check
      description: Checks public Supabase Auth settings only; it does not inspect database access or return credentials
      responses:
        "200":
          description: Public Supabase Auth settings are reachable; database access remains untested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealthStatus"
        "503":
          description: Supabase credentials are missing or the API is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealthStatus"
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a username account with an email reserved for confirmation and recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "202":
          description: Generic confirmation response that does not disclose account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with username and password only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Authenticated; session is stored in an HTTP-only cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthActionResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: End the current Supabase Auth session
      responses:
        "204":
          description: Session ended
  /auth/recovery:
    post:
      operationId: requestPasswordRecovery
      tags: [auth]
      summary: Send password recovery instructions to the registered email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "202":
          description: Generic response that does not disclose whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /auth/password:
    post:
      operationId: updatePassword
      tags: [auth]
      summary: Set a new password from a verified recovery session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdateRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Return the current account status and authorized role context
      responses:
        "200":
          description: Current account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /auth/bootstrap-status:
    get:
      operationId: getOwnerBootstrapStatus
      tags: [auth]
      summary: Check whether the signed-in, designated account may perform one-time owner setup
      responses:
        "200":
          description: Bootstrap availability only; no owner identity is disclosed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
  /auth/bootstrap-owner:
    post:
      operationId: bootstrapOwner
      tags: [auth]
      summary: Initialize the designated, confirmed platform owner once with the private bootstrap token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapOwnerRequest"
      responses:
        "200":
          description: Owner initialized for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthActionResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /auth/callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: Exchange an email confirmation or recovery code for a session
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: next
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Redirect to a local application page
        "400":
          description: Invalid or expired confirmation link
  /organizations:
    get:
      operationId: listOrganizations
      tags: [management]
      summary: List organizations visible through the current account's RLS scope
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: kind
          in: query
          schema: { type: string, enum: [company, station, provider] }
        - name: approvalStatus
          in: query
          schema: { type: string, enum: [pending, approved] }
        - name: operationalStatus
          in: query
          schema: { type: string, enum: [inactive, active, suspended] }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, code, kind, approvalStatus, operationalStatus, createdAt], default: createdAt }
        - name: sortDirection
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Filtered and paginated organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "401":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createOrganization
      tags: [management]
      summary: Create an organization request for platform owner approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created in pending status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}:
    get:
      operationId: getOrganization
      tags: [management]
      summary: Get an organization visible through the current account's RLS scope
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          $ref: "#/components/responses/ApiError"
    patch:
      operationId: updateOrganization
      tags: [management]
      summary: Update organization details with optimistic concurrency and audit
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/approval:
    post:
      operationId: approveOrganization
      tags: [management]
      summary: Approve a pending organization with a required reason
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Approval recorded; operation remains inactive until activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/status:
    patch:
      operationId: updateOrganizationStatus
      tags: [management]
      summary: Activate, suspend, or reactivate an approved organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
      responses:
        "200":
          description: Operational status changed and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/branches:
    get:
      operationId: listBranches
      tags: [management]
      summary: List branches visible to the current account in an organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Visible branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createBranch
      tags: [management]
      summary: Create a branch in an organization the account can manage
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResult"
        "403":
          $ref: "#/components/responses/ApiError"
  /branches:
    get:
      operationId: listBranchesPaginated
      tags: [management]
      summary: Search and paginate branches within one RLS-visible organization
      parameters:
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: approvalStatus
          in: query
          schema: { type: string, enum: [pending, approved] }
        - name: operationalStatus
          in: query
          schema: { type: string, enum: [inactive, active, suspended] }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, code, approvalStatus, operationalStatus, createdAt], default: createdAt }
        - name: sortDirection
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Filtered and paginated visible branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchPage"
        "403":
          $ref: "#/components/responses/ApiError"
  /branches/{branchId}:
    patch:
      operationId: updateBranch
      tags: [management]
      summary: Update branch details without changing its parent organization
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchRequest"
      responses:
        "200":
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /branches/{branchId}/approval:
    post:
      operationId: approveBranch
      tags: [management]
      summary: Approve a pending branch with a required reason
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchApprovalRequest"
      responses:
        "200":
          description: Branch approval recorded; operation remains inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /branches/{branchId}/status:
    patch:
      operationId: updateBranchStatus
      tags: [management]
      summary: Change the operational status of an approved branch and write an audit event
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchStatusRequest"
      responses:
        "200":
          description: Branch status changed and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/memberships:
    get:
      operationId: listMemberships
      tags: [management]
      summary: List employees visible within the account's organization or branch scope
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Visible memberships and profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: setMembership
      tags: [management]
      summary: Assign or update a registered user's organization and branch permissions
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMembershipRequest"
      responses:
        "200":
          description: Membership updated and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResult"
        "403":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/invitations:
    get:
      operationId: listInvitations
      tags: [management]
      summary: List pending, accepted, and revoked invitations visible to a manager
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Invitations for the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createInvitation
      tags: [management]
      summary: Create a one-time invitation for a company employee
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created; raw link is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreatedResult"
        "403":
          $ref: "#/components/responses/ApiError"
  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [management]
      summary: Accept a one-time invitation after verifying the registered email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Invitation accepted and membership activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResult"
        "403":
          $ref: "#/components/responses/ApiError"
  /invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [management]
      summary: Revoke an unused invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation revoked
        "403":
          $ref: "#/components/responses/ApiError"
  /users/{userId}/status:
    patch:
      operationId: setUserStatus
      tags: [management]
      summary: Activate or suspend an account with a required audit reason; only a platform owner may do so
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStatusRequest"
      responses:
        "200":
          description: Account state changed and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "403":
          $ref: "#/components/responses/ApiError"
  /admin/platform-users:
    get:
      operationId: listPlatformUsers
      tags: [management]
      summary: List platform accounts and their active platform roles; owner only
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: accountStatus
          in: query
          schema: { type: string, enum: [pending, active, suspended] }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/PlatformRole" }
      responses:
        "200":
          description: Searchable, paginated platform account directory without Auth email or credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUserList" }
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /admin/platform-users/{userId}:
    get:
      operationId: getPlatformUser
      tags: [management]
      summary: Read a platform account, actual role capabilities, and audited account changes; owner only
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Platform account details and recent role or status audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUserDetail" }
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /admin/platform-users/{userId}/roles:
    patch:
      operationId: setPlatformUserRoles
      tags: [management]
      summary: Replace a user's active platform roles with an audited reason; owner only
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPlatformUserRolesRequest" }
      responses:
        "200":
          description: Platform roles updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUserRolesResult" }
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organization-join-requests:
    get:
      operationId: listOrganizationJoinRequests
      tags: [management]
      summary: List join requests visible to the signed-in applicant or central reviewer
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, submitted, needs_completion, rejected, approved, withdrawn] }
      responses:
        "200":
          description: Join requests visible through row-level security
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationJoinRequestList" }
        "401":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createOrganizationJoinRequest
      tags: [management]
      summary: Start a verified applicant's organization request or let central staff create it for a username
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationJoinRequest" }
      responses:
        "201":
          description: Draft request created; it is not an approved or active organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organization-join-requests/{requestId}:
    get:
      operationId: getOrganizationJoinRequest
      tags: [management]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Request details visible to the applicant or reviewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationJoinRequest" }
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
    patch:
      operationId: updateOrganizationJoinRequest
      tags: [management]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationJoinRequest" }
      responses:
        "200":
          description: Draft or completion-request data updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organization-join-requests/{requestId}/documents:
    get:
      operationId: listOrganizationJoinRequestDocuments
      tags: [management]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Private document metadata visible to the applicant or authorized reviewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "403":
          $ref: "#/components/responses/ApiError"
  /organization-join-requests/{requestId}/submit:
    post:
      operationId: submitOrganizationJoinRequest
      tags: [management]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedVersionRequest" }
      responses:
        "200":
          description: Request submitted for central review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organization-join-requests/{requestId}/withdraw:
    post:
      operationId: withdrawOrganizationJoinRequest
      tags: [management]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedVersionRequest" }
      responses:
        "204": { description: Request withdrawn before decision }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /admin/organization-requests:
    get:
      operationId: listAdminOrganizationRequests
      tags: [management]
      summary: Central request inbox for organization, branch, banking, and document reviews
      parameters:
        - name: status
          in: query
          schema: { type: string, maxLength: 30 }
        - name: requestType
          in: query
          schema: { type: string, enum: [join, change, bank, document] }
      responses:
        "200":
          description: Central requests visible to an authorized platform reviewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrganizationRequestList" }
        "403":
          $ref: "#/components/responses/ApiError"
  /admin/organization-requests/{requestType}/{requestId}/decision:
    post:
      operationId: decideAdminOrganizationRequest
      tags: [management]
      parameters:
        - name: requestType
          in: path
          required: true
          schema: { type: string, enum: [join, change, bank, document] }
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationReviewDecision" }
      responses:
        "200":
          description: Decision recorded with reason and audit event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organization-change-requests:
    get:
      operationId: listOrganizationChangeRequests
      tags: [management]
      parameters:
        - name: organizationId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: branchId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Change requests visible through RLS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationChangeRequestList" }
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createOrganizationChangeRequest
      tags: [management]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationChangeRequest" }
      responses:
        "201":
          description: Sensitive change request created against a fixed entity version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organization-change-requests/{requestId}/resubmit:
    post:
      operationId: resubmitOrganizationChangeRequest
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResubmitOrganizationChangeRequest" }
      responses:
        "200":
          description: Completion request updated and returned to central review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organization-change-requests/{requestId}/withdraw:
    post:
      operationId: withdrawOrganizationChangeRequest
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedVersionRequest" }
      responses:
        "204": { description: Request withdrawn before decision }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}/bank-accounts:
    get:
      operationId: listOrganizationBankAccounts
      tags: [management]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Bank account versions; identifiers are never returned in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccountList" }
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: proposeOrganizationBankAccount
      tags: [management]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposeBankAccountRequest" }
      responses:
        "201":
          description: Proposed banking version pending central review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankProposalResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /bank-account-versions/{versionId}:
    get:
      operationId: getOrganizationBankAccountVersionDetails
      tags: [management]
      summary: Get full bank details only for an authorized organization banking role or central finance reviewer
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Full details for one bank version after an authorization check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccountVersionDetails" }
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /bank-account-versions/{versionId}/withdraw:
    post:
      operationId: withdrawOrganizationBankAccountVersion
      tags: [management]
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpectedVersionRequest" }
      responses:
        "204": { description: Proposed bank version withdrawn before a decision }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /documents:
    get:
      operationId: listOrganizationDocuments
      tags: [management]
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: joinRequestId
          in: query
          schema: { type: string, format: uuid }
        - name: changeRequestId
          in: query
          schema: { type: string, format: uuid }
        - name: bankVersionId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Document metadata visible to the caller; object bytes remain in a private bucket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createDocumentUploadIntent
      tags: [management]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentUploadIntent" }
      responses:
        "201":
          description: Short-lived, user-bound upload intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentUploadIntent" }
        "403":
          $ref: "#/components/responses/ApiError"
  /documents/{documentId}/content:
    put:
      operationId: uploadOrganizationDocumentContent
      tags: [management]
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: File validated and uploaded to private storage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /documents/{documentId}/download:
    get:
      operationId: createOrganizationDocumentDownload
      tags: [management]
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One-minute signed link returned only after a row-level access check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDownload" }
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /admin/billing/catalog:
    get:
      operationId: getAdminBillingCatalog
      tags: [management]
      summary: Read the owner-only plan, subscription request and subscription catalog
      responses:
        "200":
          description: Current saved plan versions and administrative subscription records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingCatalog" }
        "403":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /admin/billing/plans:
    post:
      operationId: createAdminBillingPlan
      tags: [management]
      summary: Create a draft plan with no preapproved rights
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPlanInput" }
      responses:
        "201":
          description: Draft plan and first draft version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingActionResult" }
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /admin/billing/plans/{planId}/versions:
    post:
      operationId: createAdminBillingPlanVersion
      tags: [management]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPlanVersionInput" }
      responses:
        "201":
          description: Immutable-on-publication draft version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingActionResult" }
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /admin/billing/plans/{planId}/versions/{versionId}/publish:
    post:
      operationId: publishAdminBillingPlanVersion
      tags: [management]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonInput" }
      responses:
        "200":
          description: Published or scheduled only after explicit approval of all rights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingActionResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /admin/billing/plans/{planId}/stop:
    post:
      operationId: scheduleAdminBillingPlanStop
      tags: [management]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPlanStopInput" }
      responses:
        "200":
          description: Future plan availability stop scheduled; existing subscriptions are unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingActionResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /admin/billing/subscription-requests:
    post:
      operationId: createAdminSubscriptionRequest
      tags: [management]
      summary: Save a subscription, renewal, plan-change or custom-price request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSubscriptionRequestInput" }
      responses:
        "201":
          description: Request saved; submitted requests require approved plan rights and verified scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingActionResult" }
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /admin/billing/subscription-requests/{requestId}/review:
    post:
      operationId: reviewAdminSubscriptionRequest
      tags: [management]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSubscriptionReviewInput" }
      responses:
        "200":
          description: Reviewed with audit reason; paid approval creates a pending-payment record only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingActionResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /admin/billing/subscriptions/{subscriptionId}/cancel:
    post:
      operationId: cancelAdminSubscription
      tags: [management]
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSubscriptionCancelInput" }
      responses:
        "200":
          description: Cancellation date scheduled without changing price or rights snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingActionResult" }
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ApiError:
      description: Request rejected or unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SupabaseHealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            [connected, not_configured, unauthorized, unavailable, project_mismatch]
        authHttpStatus:
          type: integer
          description: Original HTTP status from the Supabase Auth settings endpoint, when a request was made
        authErrorCode:
          type: string
          description: Sanitized upstream error code, when available
        dataAccessStatus:
          type: string
          enum: [not_tested]
        message:
          type: string
      required:
        - status
        - dataAccessStatus
    ApiError:
      type: object
      properties:
        message:
          type: string
      required: [message]
    MessageResult:
      type: object
      properties:
        message:
          type: string
      required: [message]
    AdminBillingActionResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: [string, "null"] }
        message: { type: string }
      required: [id, message]
    AdminReasonInput:
      type: object
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [reason]
    AdminPlanInput:
      type: object
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_-]{2,47}$" }
        audience: { type: string, enum: [company, provider, station] }
        name: { type: string, minLength: 2, maxLength: 100 }
        annualPriceMinor: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [code, audience, name, annualPriceMinor, reason]
    AdminPlanStopInput:
      type: object
      properties:
        stopNewAt: { type: [string, "null"], format: date-time }
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [stopNewAt, reason]
    AdminPlanEntitlement:
      type: object
      properties:
        key: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, minLength: 1, maxLength: 120 }
        value: {}
        approved: { type: boolean }
      required: [key, label, value, approved]
    AdminPlanVersionInput:
      type: object
      properties:
        annualPriceMinor: { type: integer, format: int64, minimum: 0 }
        effectiveAt: { type: string, format: date-time }
        entitlements:
          type: array
          items: { $ref: "#/components/schemas/AdminPlanEntitlement" }
        settings:
          type: array
          items: { $ref: "#/components/schemas/AdminPlanEntitlement" }
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [annualPriceMinor, effectiveAt, entitlements, settings, reason]
    AdminPlanVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        annualPriceMinor: { type: integer, format: int64 }
        nfcIssuePriceMinor: { type: integer, format: int64 }
        billingUnit: { type: string, enum: [vehicle, branch] }
        billingCycle: { type: string, enum: [annual] }
        currency: { type: string, enum: [EGP] }
        legacyFeatures:
          type: array
          items: { type: string }
        entitlements:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AdminPlanEntitlement" }
        settings:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AdminPlanEntitlement" }
        effectiveAt: { type: string, format: date-time }
        publicationStatus: { type: string, enum: [draft, scheduled, published, retired] }
      required: [id, version, annualPriceMinor, nfcIssuePriceMinor, billingUnit, billingCycle, currency, legacyFeatures, entitlements, settings, effectiveAt, publicationStatus]
    AdminPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        audience: { type: string, enum: [company, provider, station] }
        name: { type: string }
        active: { type: boolean }
        stopNewAt: { type: [string, "null"], format: date-time }
        versions:
          type: array
          items: { $ref: "#/components/schemas/AdminPlanVersion" }
      required: [id, code, audience, name, active, stopNewAt, versions]
    AdminSubscriptionRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        branchId: { type: [string, "null"], format: uuid }
        branchName: { type: [string, "null"] }
        requestType: { type: string, enum: [new, renewal, plan_change, custom_price] }
        currentSubscriptionId: { type: [string, "null"], format: uuid }
        planId: { type: string, format: uuid }
        planVersionId: { type: string, format: uuid }
        requestedPriceMinor: { type: ["integer", "null"], format: int64 }
        requestedUnits: { type: ["integer", "null"] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        coverageState: { type: string, enum: [verified, fleet_registry_missing, branch_unverified] }
        coverageNote: { type: string }
        status: { type: string, enum: [draft, submitted, needs_changes, approved, rejected, cancelled] }
        reason: { type: string }
        decisionReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, organizationId, organizationName, branchId, branchName, requestType, currentSubscriptionId, planId, planVersionId, requestedPriceMinor, requestedUnits, startsAt, endsAt, coverageState, coverageNote, status, reason, decisionReason, createdAt]
    AdminSubscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        branchId: { type: [string, "null"], format: uuid }
        branchName: { type: [string, "null"] }
        planId: { type: string, format: uuid }
        planVersionId: { type: string, format: uuid }
        planSnapshot: { type: object }
        priceSnapshotMinor: { type: integer, format: int64 }
        billingUnit: { type: string, enum: [vehicle, branch] }
        units: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [pending_payment, scheduled, active, expired, suspended, cancelled] }
        cancellationEffectiveAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, organizationId, organizationName, branchId, branchName, planId, planVersionId, planSnapshot, priceSnapshotMinor, billingUnit, units, startsAt, endsAt, status, cancellationEffectiveAt, createdAt]
    AdminBillingCatalog:
      type: object
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/AdminPlan" }
        requests:
          type: array
          items: { $ref: "#/components/schemas/AdminSubscriptionRequest" }
        subscriptions:
          type: array
          items: { $ref: "#/components/schemas/AdminSubscription" }
      required: [plans, requests, subscriptions]
    AdminSubscriptionRequestInput:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        branchId: { type: [string, "null"], format: uuid }
        requestType: { type: string, enum: [new, renewal, plan_change, custom_price] }
        currentSubscriptionId: { type: [string, "null"], format: uuid }
        planId: { type: string, format: uuid }
        planVersionId: { type: string, format: uuid }
        requestedPriceMinor: { type: ["integer", "null"], format: int64, minimum: 0 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        coverageNote: { type: string, maxLength: 1000 }
        reason: { type: string, minLength: 5, maxLength: 500 }
        submit: { type: boolean }
      required: [organizationId, branchId, requestType, currentSubscriptionId, planId, planVersionId, requestedPriceMinor, startsAt, endsAt, coverageNote, reason, submit]
    AdminSubscriptionReviewInput:
      type: object
      properties:
        decision: { type: string, enum: [approve, needs_changes, reject, cancel] }
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [decision, reason]
    AdminSubscriptionCancelInput:
      type: object
      properties:
        effectiveAt: { type: string, format: date-time }
        reason: { type: string, minLength: 5, maxLength: 500 }
      required: [effectiveAt, reason]
    SignUpRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        recoveryEmail:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 120
        password:
          type: string
          minLength: 12
          maxLength: 128
        redirectTo:
          type: string
          format: uri
      required: [username, recoveryEmail, displayName, password, redirectTo]
    SignUpResult:
      type: object
      properties:
        status:
          type: string
          enum: [confirmation_required]
        message:
          type: string
      required: [status, message]
    SignInRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [username, password]
    AuthActionResult:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required: [status, message]
    RecoveryRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Username or registered recovery email; never accepted for sign-in
          minLength: 3
          maxLength: 254
        redirectTo:
          type: string
          format: uri
      required: [identifier, redirectTo]
    PasswordUpdateRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
      required: [password]
    AuthMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        username:
          type: [string, "null"]
        loginIdentifierType:
          type: string
          enum: [username]
        state:
          type: string
          enum: [active, pending]
        accessContext: {}
      required: [id, displayName, state, accessContext]
    BootstrapStatus:
      type: object
      properties:
        available:
          type: boolean
      required: [available]
    BootstrapOwnerRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
      required: [token]
    CreateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        kind:
          type: string
          enum: [company, station, provider]
        code:
          type: string
          minLength: 2
          maxLength: 40
          pattern: "^[A-Za-z0-9_-]+$"
        legalName: { type: ["string", "null"], maxLength: 200 }
        contactName: { type: ["string", "null"], maxLength: 160 }
        contactPhone: { type: ["string", "null"], maxLength: 24 }
        contactEmail: { type: ["string", "null"], format: email, maxLength: 320 }
        address: { type: string, maxLength: 500 }
      required: [name, kind, code, address]
    PageInfo:
      type: object
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      required: [page, pageSize, total, totalPages]
    Organization:
      type: object
      properties:
