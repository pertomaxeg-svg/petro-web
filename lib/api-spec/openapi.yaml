  /catalog/reference-data:
    get:
      operationId: getCatalogReferenceData
      tags: [management]
      summary: Read active catalog categories and units for an authenticated catalog manager
      responses:
        "200":
          description: Active catalog taxonomy and measurement units
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogReferenceData" }
        "403": { $ref: "#/components/responses/ApiError" }
  /admin/catalog/categories:
    get:
      operationId: getAdminCatalogCategories
      tags: [management]
      summary: Read all catalog categories and units for authorized central roles
      responses:
        "200":
          description: Central catalog configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogReferenceData" }
        "403": { $ref: "#/components/responses/ApiError" }
  /admin/inventory:
    get:
      operationId: getAdminInventory
      tags: [management]
      summary: Read a permission-scoped merchant inventory view
      parameters:
        - { name: view, in: query, required: true, schema: { type: string, enum: [organizations, locations, branches, items, balances, summary, alerts, return_sources, documents, transfers, counts, movements, document, reconciliation] } }
        - { name: organizationId, in: query, schema: { type: string, format: uuid } }
        - { name: locationId, in: query, schema: { type: string, format: uuid } }
        - { name: documentId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: sortBy, in: query, schema: { type: string, enum: [name, available, updatedAt, createdAt, status, type, occurredAt, itemName, kind] } }
        - { name: sortDirection, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Paginated, tenant-scoped product stock views; not a sales or service ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInventoryQueryResult" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
    post:
      operationId: executeAdminInventoryCommand
      tags: [management]
      summary: Create or review an audited stock command
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecuteAdminInventoryCommand" }
      responses:
        "200":
          description: Idempotent inventory command result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInventoryCommandResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
  /admin/catalog/organizations:
    get:
      operationId: listAdminCatalogOrganizations
      tags: [management]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: kind, in: query, schema: { type: string, enum: [station, provider] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Paginated station and service-provider directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogDirectoryResult" }
        "403": { $ref: "#/components/responses/ApiError" }
  /admin/catalog/fuel:
    get:
      operationId: listAdminCatalogFuel
      tags: [management]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Fuel types, reference prices and bounded history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogFuelResult" }
        "403": { $ref: "#/components/responses/ApiError" }
  /admin/catalog/fuel/preview:
    post:
      operationId: previewAdminCatalogFuel
      tags: [management]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FuelPreviewRequest" }
      responses:
        "200":
          description: Non-financial quantity or amount estimate using the current reference price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FuelPreviewResult" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /admin/catalog/items:
    get:
      operationId: getMerchantCatalogItems
      tags: [management]
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: categoryCode, in: query, schema: { type: string, maxLength: 40 } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Paginated catalog filtered by organization and optional authorized branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemsResult" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /catalog/items/{itemId}:
    get:
      operationId: getCatalogItem
      tags: [management]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Catalog item, visible branch availability, scoped prices and private image metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemResult" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /catalog/commands:
    post:
      operationId: executeCatalogCommand
      tags: [management]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogCommandRequest" }
      responses:
        "200":
          description: Idempotent catalog command result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCommandResult" }
        "201":
          description: New catalog row created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCommandResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /catalog/images/{imageId}/content:
    put:
      operationId: uploadCatalogImageContent
      tags: [management]
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Private image uploaded and metadata marked ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImageResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /catalog/images/{imageId}/download:
    get:
      operationId: downloadCatalogImage
      tags: [management]
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Short-lived signed URL for an authorized private catalog image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImageDownload" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ApiError:
      description: Request rejected or unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    AdminInventoryQueryResult:
      type: object
      additionalProperties: true
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        consistent: { type: boolean }
        summary: { type: object, additionalProperties: true }
      required: [items]
    ExecuteAdminInventoryCommand:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [location.create, reorder.set, document.create, document.review, reservation.reserve, reservation.release, reservation.consume]
        payload: { type: object, additionalProperties: true }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
      required: [action, payload, idempotencyKey]
    AdminInventoryCommandResult:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        type: { type: string }
      required: [id, status]
    CatalogReferenceData:
      type: object
      additionalProperties: true
      properties:
        categories:
          type: array
          items: { type: object, additionalProperties: true }
        units:
          type: array
          items: { type: object, additionalProperties: true }
    AdminCatalogDirectoryResult:
      type: object
      additionalProperties: true
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
    AdminCatalogFuelResult:
      type: object
      additionalProperties: true
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
        canManage: { type: boolean }
    CatalogItemsResult:
      type: object
      additionalProperties: true
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
        canManage: { type: boolean }
        canManageOrganization: { type: boolean }
        canReview: { type: boolean }
    CatalogItemResult:
      type: object
      additionalProperties: true
      properties:
        item: { type: object, additionalProperties: true }
        centralSuspended: { type: boolean }
        manageableBranches:
          type: array
          items: { type: object, additionalProperties: true }
        availability:
          type: array
          items: { type: object, additionalProperties: true }
        prices:
          type: array
          items: { type: object, additionalProperties: true }
        images:
          type: array
          items: { type: object, additionalProperties: true }
    FuelPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        fuelTypeId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
        amountMinor: { type: string, pattern: "^[1-9][0-9]{0,14}$" }
      required: [fuelTypeId]
    FuelPreviewResult:
      type: object
      additionalProperties: true
    CatalogCommandRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            [unit.create, unit.status, category.create, category.update, category.status,
             fuel.type.create, fuel.type.update, fuel.type.status, fuel.price.create_draft,
             fuel.price.publish, fuel.price.cancel, item.create, item.update, item.status,
             item.review, item.branch_availability, item.price.create_draft, item.price.publish,
             item.price.cancel, item.image.intent, item.image.remove]
        payload:
          type: object
          additionalProperties: true
        reason: { type: string, minLength: 3, maxLength: 500 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 120 }
      required: [action, payload, idempotencyKey]
    CatalogCommandResult:
      type: object
      additionalProperties: true
    CatalogImageResult:
      type: object
      additionalProperties: true
    CatalogImageDownload:
      type: object
      additionalProperties: false
      properties:
        signedUrl: { type: string, format: uri }
        expiresInSeconds: { type: integer, minimum: 1 }
        fileName: { type: string }
      required: [signedUrl, expiresInSeconds, fileName]
    AdminFleetCatalog:
      type: object
      additionalProperties: true
    AdminFleetCards:
      type: object
      additionalProperties: true
      required: [view, items, total, page, pageSize]
      properties:
        view:
          type: string
          enum: [overview, requests, issued, stock, history]
        items:
          type: array
          items: { type: object, additionalProperties: true }
        summary:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    AdminFleetCompanySummaries:
      type: object
      additionalProperties: true
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        company:
          type: object
          additionalProperties: true
        branches:
          type: array
          items: { type: object, additionalProperties: true }
        total: { type: integer, minimum: 0 }
        branchTotal: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        nfcIssuePriceMinor: { type: integer, minimum: 0 }
    AdminFleetDriverDetail:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationCode: { type: string }
        driverCode: { type: string }
        fullName: { type: string }
        phone: { type: [string, "null"] }
        status: { type: string }
        version: { type: integer, minimum: 1 }
        links:
          type: array
          items: { type: object, additionalProperties: true }
    AdminFleetConsumptionRates:
      type: object
      additionalProperties: true
      properties:
        current:
          type: [object, "null"]
          additionalProperties: true
        history:
          type: array
          items: { type: object, additionalProperties: true }
        organizationId: { type: string, format: uuid }
        branchId: { type: [string, "null"], format: uuid }
    FleetConsumptionRateInput:
      type: object
      additionalProperties: false
      properties:
        organizationId: { type: string, format: uuid }
        branchId: { type: [string, "null"], format: uuid }
        litersPer100Km: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, minLength: 3, maxLength: 500 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 120 }
      required: [organizationId, branchId, litersPer100Km, reason, idempotencyKey]
    AdminFleetReferenceOptions:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      required: [items, page, pageSize, total, totalPages]
    AdminFleetStockReservations:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string, format: uuid }
              stockUnitId: { type: string, format: uuid }
              unitCode: { type: string }
              requestId: { type: string, format: uuid }
              requestStatus: { type: string }
              vehicleId: { type: string, format: uuid }
              vehiclePlate: { type: string }
              organizationId: { type: string, format: uuid }
              organizationName: { type: string }
              branchId: { type: string, format: uuid }
              branchName: { type: string }
              reservedAt: { type: string, format: date-time }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      required: [items, page, pageSize, total, totalPages]
    AdminFleetCommandRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            [vehicle.create, vehicle.update, vehicle.move, vehicle.status, driver.create, driver.update, driver.status,
             driver.link.create, driver.link.end, driver.pin.rotate, policy.create, policy.update, policy.publish,
             coverage.assign, coverage.end, credential.request, credential.approve, credential.assign, credential.install,
             credential.activate_qr, credential.activate_nfc, credential.stop, odometer.record, odometer.review,
             maintenance.create, maintenance.cancel, tag_stock.receive, tag_stock.reserve, tag_stock.damage,
             import.preview, import.apply]
        payload:
          type: object
          additionalProperties: true
        reason: { type: string, minLength: 3, maxLength: 500 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 120 }
      required: [action, payload, reason, idempotencyKey]
    AdminFleetCommandResult:
      type: object
      additionalProperties: true
    AdminFleetVerifyPairRequest:
      type: object
      additionalProperties: false
      properties:
        linkId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        pinCode: { type: string, pattern: "^[0-9]{4}$" }
      required: [linkId, vehicleId, pinCode]
    AdminFleetDriverPairPinRevealInput:
      type: object
      additionalProperties: false
      properties:
        linkId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
      required: [linkId, reason]
    AdminFleetDriverPairPinRevealResult:
      type: object
      additionalProperties: false
      properties:
        pinCode: { type: string, pattern: "^[0-9]{4}$" }
        resetRequired: { type: boolean }
        expiresInSeconds: { type: integer, minimum: 1, maximum: 60 }
      required: [resetRequired]
    AdminFleetVerifyPairResult:
      type: object
      additionalProperties: true
      properties:
        valid: { type: boolean }
        locked: { type: boolean }
        retryAt: { type: [string, "null"], format: date-time }
        verificationId: { type: string, format: uuid }
      required: [valid, locked]
    AdminFleetDocumentUploadIntentRequest:
      type: object
      additionalProperties: false
      properties:
        vehicleId: { type: string, format: uuid }
        documentType: { type: string, minLength: 2, maxLength: 80 }
        fileName: { type: string, minLength: 1, maxLength: 160 }
        contentType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        byteSize: { type: integer, minimum: 1, maximum: 10485760 }
        expiresOn: { type: [string, "null"], format: date }
      required: [vehicleId, documentType, fileName, contentType, byteSize]
    AdminFleetDocumentUploadIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        objectPath: { type: string }
        bucket: { type: string, enum: [petro-private-documents] }
      required: [id, objectPath, bucket]
    AdminFleetImportApplyRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 120 }
      required: [reason, idempotencyKey]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SupabaseHealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            [connected, not_configured, unauthorized, unavailable, project_mismatch]
        authHttpStatus:
